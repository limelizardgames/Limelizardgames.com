<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Settings — Lime Lizard Games</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/portal.css"><link rel="icon" href="/assets/lime-lizard-head.svg" type="image/svg+xml"></head><body><header class="topbar page-shell"><a href="/"><img src="/assets/lime-lizard-word.svg" alt="Lime Lizard Games"></a><a href="/">← Back to Lime Lizard Games</a></header>
<main class="page-shell profile-page"><section class="profile-head"><div><p class="eyebrow">PLAYER SETTINGS</p><h1>Account</h1></div></section>
<div class="account-grid"><aside class="panel"><a class="sidebar-link active" href="/account/">Profile Settings</a><a class="sidebar-link" href="/profile/">View Profile</a><button id="signOut" class="sidebar-link danger" style="width:100%;text-align:left;border:0;background:none;font:inherit;cursor:pointer">Sign Out</button></aside>
<section class="panel"><h2>Profile Settings</h2><form id="accountForm"><div class="field"><label for="username">Username</label><input id="username" name="username" pattern="[A-Za-z0-9_]{3,20}" minlength="3" maxlength="20" required><small>Your unique Lime Lizard player name.</small></div><div class="field"><label for="displayName">Display name</label><input id="displayName" name="displayName" maxlength="40" required></div><div class="field"><label>Email</label><input id="email" type="email" disabled></div><div id="message" class="message"></div><div class="save-row"><button class="primary-button" id="saveButton" type="submit">Save Changes</button></div></form></section></div>
</main><script type="module" src="/account/account.js"></script></body></html>
