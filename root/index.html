<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14221e"><title>Thistlewick • Root GM Chronicle</title><style>
:root{--bg:#10201b;--card:#1d322a;--card2:#284336;--line:#45624e;--txt:#f7f0db;--dim:#b7c8b9;--gold:#e3be77;--red:#df9c91;--green:#9ec7a7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3{font-family:Georgia,serif;margin:0 0 10px}h1{font-size:32px}h2{font-size:24px}p{color:var(--dim);margin:5px 0 14px}small,.muted{color:var(--dim)}.layout{display:flex;min-height:100vh}.side{width:242px;background:#142720;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;flex:none;overflow:auto}.logo{font:25px Georgia,serif;padding:12px;color:var(--gold)}.logo small{font:11px system-ui;display:block;letter-spacing:2px;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;text-align:left;border:0;color:var(--dim);padding:12px;border-radius:10px}.nav button.on,.nav button:hover{background:#35523e;color:var(--txt)}main{padding:28px;max-width:1400px;flex:1;min-width:0}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.badge{display:inline-block;border:1px solid #876f46;border-radius:20px;color:var(--gold);padding:3px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--card);min-width:0;margin-bottom:14px}.hero{background:linear-gradient(110deg,#355542,#1a3429);padding:28px;border-radius:18px;margin-bottom:25px;border:1px solid #6a866b}.btn{background:var(--gold);color:#291e0e;font-weight:750;padding:10px 15px;border:0;border-radius:8px;margin:3px}.btn.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.btn.danger{background:#723c34;color:white}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:13px}.field label{font-size:12px;color:var(--dim)}input,textarea,select{width:100%;background:#11251e;color:var(--txt);padding:10px;border-radius:8px;border:1px solid #57715a}textarea{min-height:88px;resize:vertical}.stack{display:grid;gap:5px}.stat{background:#13291e;padding:9px;border-radius:9px;text-align:center}.stat strong{font:26px Georgia,serif;color:var(--gold);display:block}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tiny{font-size:11px}.track{display:flex;gap:6px;flex-wrap:wrap}.box{width:25px;height:26px;border-radius:5px;background:#13251c;border:2px solid #6b816e}.box.fill{background:var(--red);border-color:#efc1ab}.line{border-bottom:1px solid var(--line);padding:12px 0}.line:last-child{border:none}.notice{padding:14px;border-radius:9px;background:#37472d;color:#f6e3b9;margin:12px 0}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:13px 0}.tabs button.on{background:var(--gold);color:#20180c}.modalback{position:fixed;inset:0;background:#050d0bd8;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:10}.modal{background:#193126;border:1px solid #7a946d;border-radius:18px;padding:22px;width:min(900px,100%);margin:auto}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sub{font:19px Georgia,serif;color:var(--gold);margin:18px 0 10px}.hide{display:none}.roll{font:48px Georgia,serif;color:var(--gold)}.status{color:var(--green);font-size:12px}.print-only{display:none}pre{white-space:pre-wrap}.rowbutton{border:1px solid var(--line);background:#263e31;border-radius:8px;color:var(--txt);padding:7px 10px}
@media(max-width:980px){.side{width:180px}.grid{grid-template-columns:repeat(2,1fr)}main{padding:16px}}@media(max-width:700px){.layout{display:block}.side{position:static;width:auto;height:auto;padding:8px}.logo{font-size:19px;padding:4px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px;font-size:13px}.grid,.grid.two,.twocol{grid-template-columns:1fr}h1{font-size:25px}.head{display:block}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.stat{padding:5px}.stat strong{font-size:19px}.card{padding:14px}}
@media print{body{background:#fff;color:#111;font:12px Georgia,serif}.side,.no-print,.btn,.head,#main{display:none!important}.print-only{display:block!important}.print-sheet{page-break-after:always;border:1px solid #444;padding:15px;margin-bottom:10px}h1,h2{color:#111}p,small{color:#333}.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.print-box{border:1px solid #aaa;padding:8px;margin:7px 0;white-space:pre-wrap}}
</style></head><body>
<div class="layout"><aside class="side no-print"><div class="logo">🌳 Thistlewick<small>GM Chronicle</small></div><nav id="nav" class="nav"></nav><p class="tiny" style="padding:10px">🔒 Data stays in this browser. Export backups regularly. This version is not account-based or synchronized across devices.</p></aside><main><div id="main"></div><div id="print" class="print-only"></div></main></div><div id="modalroot"></div><script>
const KEY='thistlewick_portal_v2';
const stats=['Charm','Cunning','Finesse','Luck','Might'], books=['The Adventurer','The Arbiter','The Harrier','The Ranger','The Ronin','The Scoundrel','The Thief','The Tinker','The Vagrant'];
const seed=()=>({campaign:{name:'The Unfortunate Adventures of the Critter Committee',season:'A Nut Above the Law',session:1},characters:Array.from({length:3},(_,i)=>({id:'pc'+i,name:'',player:'',animal:'',playbook:books[i],pronouns:'',nature:'',drives:'',connections:'',moves:'',skills:'',feats:'',look:'',notes:'',secret:'',stats:Object.fromEntries(stats.map(s=>[s,0])),injury:0,exhaustion:0,depletion:0,inventory:[],reputation:'',value:0,advancement:0})),npcs:[{id:'n1',name:'Mayor Bartholomew Bramblebottom',animal:'Mouse',role:'Mayor',faction:'Village',status:'Active',voice:'Pompous and nervous',secret:'Covered up the Golden Acorn fraud for twenty years.',notes:'Offers 50 coins for the relic.'},{id:'n2',name:'Sir Quackson the Unyielding',animal:'Duck',role:'Self-appointed sovereign',faction:'Duckistan',status:'Active',voice:'Bombastic would-be king',secret:'His kingdom is only a bridge and two ducks.',notes:'Demand tolls of sandwiches, compliments, or duels.'},{id:'n3',name:'Nibbles McCrackin',animal:'Squirrel',role:'Panicked informant',faction:'Independent',status:'Active',voice:'Screaming, talks too fast',secret:'Wrongly believes ducks stole the relic.',notes:'Has yellow paint on his claws.'},{id:'n4',name:'Captain Cornelius Clawford',animal:'Cat',role:'Marquisate commander',faction:'Marquise de Cat',status:'Active',voice:'Angry paperwork obsessive',secret:'Wants the tax ledger to exploit the mayor.',notes:'Arrives at Hollow Oak with three soldiers.'},{id:'n5',name:'Morris Diggleby',animal:'Mole',role:'Mayoral assistant',faction:'Independent',status:'Active',voice:'Softly apologetic',secret:'Stole the painted walnut and ledger.',notes:'Wants to expose the mayor.'},{id:'n6',name:'Mabel Sogbottom',animal:'Stoat',role:'Tavernkeeper',faction:'Village',status:'Active',voice:'Gravelly and unimpressed',secret:'Knows the original relic vanished years ago.',notes:'Owns the Soggy Stoat Tavern.'}],notes:[{id:'note1',title:'The truth about the acorn',category:'Secret',body:'The Golden Acorn is a painted walnut. The real acorn vanished twenty years ago. Its significance is political, not magical.'}],sessions:[{id:'s1',title:'A Nut Above the Law',date:'',status:'Planned',recap:'Tavern -> Duck bridge -> Hollow Oak -> Marquisate confrontation. Let players choose who receives the ledger.'}],clocks:[{id:'c1',title:'Marquisate suspicion',value:0,max:6},{id:'c2',title:'Village unrest',value:0,max:6},{id:'c3',title:'Duckistan hostility',value:0,max:4}],loot:[],history:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}let page='dashboard',modal='',current=0;
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&quot;'}[c])),id=()=>Math.random().toString(36).slice(2,10);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('#saved')?.replaceChildren(document.createTextNode('Saved locally ✓'))}catch{alert('Storage full/unavailable. Export a backup!')}}function field(label,key,v,kind='text'){const iid='i_'+key;return '<div class="field"><label for="'+iid+'">'+esc(label)+'</label>'+(kind==='textarea'?'<textarea id="'+iid+'" data-key="'+key+'">'+esc(v)+'</textarea>':kind==='select'?'<select id="'+iid+'" data-key="'+key+'">'+books.map(b=>'<option '+(b===v?'selected':'')+'>'+esc(b)+'</option>').join('')+'</select>':'<input id="'+iid+'" data-key="'+key+'" type="'+kind+'" value="'+esc(v)+'">')+'</div>'}
const nav=[['dashboard','🏠 Overview'],['characters','🐾 Characters'],['dice','🎲 Dice Roller'],['npcs','🦊 NPC Directory'],['sessions','📜 Sessions'],['clocks','🚩 Factions & Clocks'],['notes','📓 GM Notes'],['loot','🎒 Shared Loot'],['settings','⚙️ Settings']];
function header(t,sub,act=''){return '<div class="head"><div><div class="badge">ROOT • CAMPAIGN MANAGER</div><h1>'+t+'</h1><p>'+sub+'</p></div><div>'+act+'</div></div>'}
function setPage(p){page=p;paint()}
function paint(){ $('#nav').innerHTML=nav.map(([k,l])=>'<button class="'+(page===k?'on':'')+'" data-nav="'+k+'">'+l+'</button>').join('');$('#main').innerHTML=({dashboard,characters,dice,npcs,sessions,clocks,notes,loot,settings}[page]||dashboard)(); }
function dashboard(){return header('Welcome to Thistlewick','The Unfortunate Adventures of the Critter Committee')+'<section class="hero"><span class="badge">SEASON ONE</span><h1>A Nut Above the Law</h1><p>Three vagabonds. One painted walnut. One corrupt mayor. An unreasonably angry duck.</p><button class="btn" data-nav="characters">Create Characters</button><button class="btn alt" data-nav="sessions">Run Session One</button></section><div class="grid"><div class="card"><h2>'+data.characters.length+'</h2><p>Player character slots</p></div><div class="card"><h2>'+data.npcs.length+'</h2><p>Tracked NPCs</p></div><div class="card"><h2>'+data.sessions.length+'</h2><p>Adventure sessions</p></div></div><div class="grid two"><div class="card"><h2>Party</h2>'+data.characters.map((c,i)=>'<div class="line flex space"><div><b>'+esc(c.name||'Unnamed Vagabond '+(i+1))+'</b><div class="tiny muted">'+esc(c.animal)+' · '+esc(c.playbook)+'</div></div><button class="btn alt" data-editpc="'+i+'">Edit</button></div>').join('')+'</div><div class="card"><h2>Adventure prompts</h2><p>Opening: Mayor Bramblebottom declares that someone stole his most precious nut. Nibbles bursts in shouting “THE DUCKS KNOW EVERYTHING!”</p><p>Clues: yellow paint, a torn button, Morris’s cart, bridge toll, Hollow Oak.</p><p>Final choice: expose the mayor, sell the ledger, or flee with everything.</p></div></div>'}
function track(label,c,key){return '<div class="line"><div class="flex space"><b>'+label+'</b><span>'+c[key]+'/4</span></div><div class="track">'+[1,2,3,4].map(n=>'<button title="'+label+' '+n+'" class="box '+(n<=c[key]?'fill':'')+'" data-track="'+key+'" data-trackn="'+n+'"></button>').join('')+'</div></div>'}
function characters(){return header('Your Vagabonds','Create printable character records and update live condition tracks.','<button class="btn" data-addpc>+ Add Vagabond</button><button class="btn alt" data-printall>🖨 Print Party</button>')+'<div class="notice">Root tracks Injury, Exhaustion and Depletion rather than conventional HP. Starting stats and playbook moves must be chosen from the official playbook; this app records them without inventing rules.</div><div class="grid">'+data.characters.map((c,i)=>'<div class="card"><div class="flex space"><h2>'+esc(c.name||'Unnamed Vagabond')+'</h2><span>🐾</span></div><p>'+esc(c.player||'Player '+(i+1))+' · '+esc(c.animal)+' · '+esc(c.playbook)+'</p><div class="stats">'+stats.map(s=>'<div class="stat"><span class="tiny">'+s.slice(0,3)+'</span><strong>'+(c.stats[s]>=0?'+':'')+c.stats[s]+'</strong></div>').join('')+'</div>'+track('Injury',c,'injury')+track('Exhaustion',c,'exhaustion')+track('Depletion',c,'depletion')+'<button class="btn" data-editpc="'+i+'">Open Sheet</button><button class="btn alt" data-printpc="'+i+'">Print</button></div>').join('')+'</div>'}
function dice(){return header('Dice Roller','Roll official 2d6 + stat moves, or ordinary six-sided dice.')+'<div class="grid two"><div class="card"><h2>Roll for a move</h2><div class="twocol"><div class="field"><label>Character</label><select id="rollpc"><option value="-1">No character</option>'+data.characters.map((c,i)=>'<option value="'+i+'">'+esc(c.name||'Player '+(i+1))+'</option>').join('')+'</select></div><div class="field"><label>Stat</label><select id="rollstat"><option value="manual">Manual modifier</option>'+stats.map(x=>'<option>'+x+'</option>').join('')+'</select></div></div>'+field('Modifier','rollmod',0,'number')+field('Reason / move','rollreason','')+'<button class="btn" data-roll>🎲 Roll 2d6</button><button class="btn alt" data-d6>Roll 1d6</button><div id="rollresult" class="roll"></div><p>10+ strong hit · 7–9 weak hit · 6 or less miss. Use the triggered move’s exact text.</p></div><div class="card"><h2>Roll history</h2><div id="history">'+data.history.slice(0,20).map(x=>'<div class="line"><b>'+esc(x.result)+'</b> — '+esc(x.reason)+'<div class="tiny muted">'+esc(x.when)+'</div></div>').join('')+'</div></div></div>'}
function npcCard(n){return '<div class="card"><h2>'+esc(n.name)+'</h2><p>'+esc(n.animal)+' · '+esc(n.role)+'</p><div class="badge">'+esc(n.faction)+'</div><p>Status: '+esc(n.status)+'</p><p>Voice: '+esc(n.voice)+'</p><p><b>GM secret:</b> '+esc(n.secret)+'</p><p>'+esc(n.notes)+'</p><button class="btn alt" data-editnpc="'+esc(n.id)+'">Edit NPC</button></div>'}
function npcs(){return header('NPC Directory','Track relationships, secrets and recurring disasters.','<button class="btn" data-addnpc>+ Add NPC</button>')+'<div class="grid">'+data.npcs.map(npcCard).join('')+'</div>'}
function sessions(){return header('Session Planner','Adventure arcs, preparations and recaps.','<button class="btn" data-addsession>+ New Session</button>')+'<div class="grid two">'+data.sessions.map(s=>'<div class="card"><div class="badge">'+esc(s.status)+'</div><h2>'+esc(s.title)+'</h2><p>'+esc(s.date||'No date scheduled')+'</p><pre>'+esc(s.recap)+'</pre><button class="btn alt" data-editsession="'+esc(s.id)+'">Edit Session</button></div>').join('')+'</div><div class="card"><h2>Episode 1 • GM scene guide</h2><div class="line">1. Soggy Stoat Tavern — Mayor announces the theft and Nibbles bursts in.</div><div class="line">2. Bridge of Unreasonable Tolls — Sir Quackson demands a sandwich, three compliments, or duel.</div><div class="line">3. Hollow Oak — Find Morris, the yellow-painted walnut and embezzled taxes.</div><div class="line">4. Cat patrol — Clawford arrives to seize the evidence.</div><div class="line">5. Cliffhanger — Revolution begins, or the vagabonds become wanted fugitives.</div></div>'}
function clocks(){return header('Factions & Story Clocks','Optional pressure tracks; not a substitute for official faction reputation.','<button class="btn" data-addclock>+ Add Clock</button>')+'<div class="grid">'+data.clocks.map(c=>'<div class="card"><h2>'+esc(c.title)+'</h2><p>'+c.value+' / '+c.max+'</p><div class="track">'+Array.from({length:c.max},(_,i)=>'<button class="box '+(i<c.value?'fill':'')+'" data-clock="'+c.id+'" data-value="'+(i+1)+'"></button>').join('')+'</div><button class="btn alt" data-resetclock="'+c.id+'">Reset</button></div>').join('')+'</div><div class="card"><h2>Major factions</h2><div class="line">🐈 Marquise de Cat — control, taxes, security.</div><div class="line">🦅 Eyrie Dynasties — reclaim ancestral lands.</div><div class="line">🐭 Woodland Alliance — liberation, revolt, and political risk.</div><div class="line">🦆 Duckistan — Sir Quackson’s self-proclaimed bridge kingdom.</div></div>'}
function notes(){return header('GM Notebook','Store clues, secrets, jokes, improvised lore, and player theories.','<button class="btn" data-addnote>+ New Note</button>')+'<div class="grid">'+data.notes.map(n=>'<div class="card"><div class="badge">'+esc(n.category)+'</div><h2>'+esc(n.title)+'</h2><p style="white-space:pre-wrap">'+esc(n.body)+'</p><button class="btn alt" data-editnote="'+n.id+'">Edit</button></div>').join('')+'</div>'}
function loot(){return header('Party Inventory','Shared loot, evidence and quest items.','<button class="btn" data-addloot>+ Add Item</button>')+'<div class="card">'+data.loot.map(l=>'<div class="line flex space"><div><b>'+esc(l.name)+'</b> × '+esc(l.qty)+'<p>Owner: '+esc(l.owner)+' • '+esc(l.notes)+'</p></div><button class="btn alt" data-editloot="'+l.id+'">Edit</button></div>').join('')+'</div>'}
function settings(){return header('Campaign Settings','Manage campaign identity, storage and backups.')+'<div class="grid two"><div class="card"><h2>Campaign</h2>'+field('Campaign name','campaign.name',data.campaign.name)+field('Season','campaign.season',data.campaign.season)+field('Session number','campaign.session',data.campaign.session,'number')+'</div><div class="card"><h2>Save & print</h2><p>Autosaves to your current browser. Different devices do not sync.</p><button class="btn" data-export>⬇ Export backup</button><button class="btn alt" data-import>⬆ Import backup</button><input type="file" id="importfile" class="hide" accept=".json"><button class="btn alt" data-printall>🖨 Print all characters</button><hr><button class="btn danger" data-reset>Reset demo campaign</button><p class="tiny">This site is publicly reachable. GM secrets are stored in this device’s browser and the starter NPC lore is part of the site. Do not put sensitive personal information here.</p></div></div><div id="saved" class="status">Saved locally ✓</div>'}
function editor(title,body,buttons=''){ $('#modalroot').innerHTML='<div class="modalback"><div class="modal"><div class="flex space"><h2>'+title+'</h2><button class="btn alt" data-close>✕ Close</button></div>'+body+'<div class="flex">'+buttons+'</div></div></div>'}
function editpc(i){current=i;const c=data.characters[i];const g=(l,k,v,t='text')=>field(l,k,v,t);editor('Character Sheet — '+esc(c.name||'New Vagabond'),'<div class="tabs"><button class="btn alt" data-printpc="'+i+'">🖨 Print Sheet</button><button class="btn alt" data-deletepc="'+i+'">Delete Character</button></div><div class="twocol">'+g('Character name','name',c.name)+g('Player','player',c.player)+g('Species','animal',c.animal)+g('Playbook','playbook',c.playbook,'select')+g('Pronouns','pronouns',c.pronouns)+g('Appearance','look',c.look)+'</div><h3 class="sub">Five official stats</h3><div class="stats">'+stats.map(s=>'<div class="field"><label>'+s+'</label><input type="number" data-stat="'+s+'" value="'+c.stats[s]+'" min="-3" max="3"></div>').join('')+'</div><h3 class="sub">Condition tracks</h3>'+['injury','exhaustion','depletion'].map(k=>'<div class="line flex space"><b>'+k+'</b><div class="flex"><button class="rowbutton" data-pctrack="'+k+'" data-delta="-1">−</button><b>'+c[k]+' / 4</b><button class="rowbutton" data-pctrack="'+k+'" data-delta="1">+</button></div></div>').join('')+'<h3 class="sub">Official playbook choices & notes</h3><div class="twocol">'+g('Nature','nature',c.nature)+g('Drives','drives',c.drives)+g('Roguish feats','feats',c.feats,'textarea')+g('Weapon skills','skills',c.skills,'textarea')+g('Moves','moves',c.moves,'textarea')+g('Relationships & connections','connections',c.connections,'textarea')+g('Faction reputation','reputation',c.reputation,'textarea')+g('Value','value',c.value,'number')+g('Advancement','advancement',c.advancement,'number')+g('Private secrets','secret',c.secret,'textarea')+g('Session notes','notes',c.notes,'textarea')+'</div><h3 class="sub">Personal equipment</h3><div class="stack">'+c.inventory.map((it,j)=>'<div class="flex space line"><span>'+esc(it.name)+' · '+esc(it.notes)+' · wear '+(it.wear||0)+'</span><div><button class="rowbutton" data-wear="'+j+'" data-delta="-1">−</button><button class="rowbutton" data-wear="'+j+'" data-delta="1">+</button><button class="rowbutton" data-removeitem="'+j+'">Delete</button></div></div>').join('')+'</div><div class="twocol">'+g('New item','newitem','')+g('Item notes','newitemnotes','')+'</div><button class="btn alt" data-additem>+ Add item</button>','<button class="btn" data-close>Done</button>')}
function genericEdit(kind,i){let obj,title,props;if(kind==='npc'){obj=data.npcs.find(x=>x.id===i);title='NPC';props=['name','animal','role','faction','status','voice','secret','notes']}if(kind==='note'){obj=data.notes.find(x=>x.id===i);title='Note';props=['title','category','body']}if(kind==='session'){obj=data.sessions.find(x=>x.id===i);title='Session';props=['title','date','status','recap']}if(kind==='loot'){obj=data.loot.find(x=>x.id===i);title='Party Item';props=['name','qty','owner','notes']}editor('Edit '+title,'<div class="twocol">'+props.map(k=>field(k,'generic.'+k,obj[k],['secret','notes','recap','body'].includes(k)?'textarea':'text')).join('')+'</div>','<button class="btn danger" data-deletegeneric="'+kind+'" data-gid="'+i+'">Delete '+title+'</button>');$('#modalroot').dataset.kind=kind;$('#modalroot').dataset.gid=i}
function printable(c){return '<article class="print-sheet"><h1>Root RPG • Vagabond Sheet</h1><h2>'+esc(c.name||'Unnamed Vagabond')+'</h2><p>'+esc(c.player)+' · '+esc(c.animal)+' · '+esc(c.playbook)+'</p><div class="print-grid"><div class="print-box"><b>Stats</b><p>'+stats.map(s=>s+': '+(c.stats[s]>=0?'+':'')+c.stats[s]).join(' | ')+'</p><b>Injury:</b> '+c.injury+'/4<br><b>Exhaustion:</b> '+c.exhaustion+'/4<br><b>Depletion:</b> '+c.depletion+'/4<br><b>Value:</b> '+c.value+'<br><b>Advancement:</b> '+c.advancement+'</div><div class="print-box"><b>Nature</b><p>'+esc(c.nature)+'</p><b>Drives</b><p>'+esc(c.drives)+'</p><b>Faction Reputation</b><p>'+esc(c.reputation)+'</p></div></div><div class="print-grid"><div><div class="print-box"><b>Moves</b><p>'+esc(c.moves)+'</p></div><div class="print-box"><b>Skills & Feats</b><p>'+esc(c.skills)+' / '+esc(c.feats)+'</p></div><div class="print-box"><b>Relationships</b><p>'+esc(c.connections)+'</p></div></div><div><div class="print-box"><b>Inventory</b><p>'+c.inventory.map(x=>esc(x.name)+' (wear '+(x.wear||0)+') '+esc(x.notes)).join('<br>')+'</p></div><div class="print-box"><b>Appearance</b><p>'+esc(c.look)+'</p></div><div class="print-box"><b>Notes</b><p>'+esc(c.notes)+'</p></div></div></div><p>For official move text and playbook instructions, refer to the player’s Root RPG playbook.</p></article>'}
function printChars(chars){$('#print').innerHTML=chars.map(printable).join('');window.print()}
function bind(){document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){setPage(d.nav);return}if('close'in d){$('#modalroot').innerHTML='';paint();return}if('editpc'in d){editpc(+d.editpc);return}if('addpc'in d){data.characters.push(seed().characters[0]);data.characters.at(-1).id=id();save();paint();editpc(data.characters.length-1);return}if('deletepc'in d){if(confirm('Delete this character?')){data.characters.splice(+d.deletepc,1);save();$('#modalroot').innerHTML='';paint()}return}if('track'in d){let c=data.characters.find(x=>x.id===d.cid)||data.characters.find(x=>x===data.characters[0]);const card=b.closest('.card');const ci=[...card.parentElement.children].indexOf(card);c=data.characters[ci];c[d.track]=c[d.track]===+d.trackn?+d.trackn-1:+d.trackn;save();paint();return}if('pctrack'in d){const c=data.characters[current];c[d.pctrack]=Math.min(4,Math.max(0,c[d.pctrack]+ +d.delta));save();editpc(current);return}if('wear'in d){let item=data.characters[current].inventory[+d.wear];item.wear=Math.max(0,(+item.wear||0)+ +d.delta);save();editpc(current);return}if('removeitem'in d){data.characters[current].inventory.splice(+d.removeitem,1);save();editpc(current);return}if('additem'in d){const n=$('[data-key="newitem"]')?.value.trim();if(n){data.characters[current].inventory.push({name:n,notes:$('[data-key="newitemnotes"]').value,wear:0});save();editpc(current)}return}if('printpc'in d){printChars([data.characters[+d.printpc]]);return}if('printall'in d){printChars(data.characters);return}
if('roll'in d||'d6'in d){let a=1+Math.floor(Math.random()*6),bb=1+Math.floor(Math.random()*6),pc=+$('#rollpc').value,st=$('#rollstat').value,mod=st==='manual'?(+$('#rollmod').value||0):pc>=0?(data.characters[pc].stats[st]||0):0,total=a+('roll'in d?bb:0)+('roll'in d?mod:0),res='roll'in d?(total>=10?'Strong hit':total>=7?'Weak hit':'Miss'):'d6 result';let msg='roll'in d?a+' + '+bb+' '+(mod>=0?'+ ':'− ')+Math.abs(mod)+' = '+total+' · '+res:String(a);$('#rollresult').textContent=msg;data.history.unshift({id:id(),result:msg,reason:$('#rollreason').value||st,when:new Date().toLocaleString()});data.history=data.history.slice(0,100);save();$('#history').innerHTML=data.history.slice(0,20).map(x=>'<div class="line"><b>'+esc(x.result)+'</b> — '+esc(x.reason)+'</div>').join('');return}
for(const k of ['npc','note','session','loot']){if('add'+k in d){const defaults={npc:{name:'New NPC',animal:'',role:'',faction:'Independent',status:'Active',voice:'',secret:'',notes:''},note:{title:'New Note',category:'General',body:''},session:{title:'Untitled Session',date:'',status:'Planned',recap:''},loot:{name:'New Item',qty:1,owner:'Party',notes:''}};let o={...defaults[k],id:id()};data[k==='npc'?'npcs':k==='note'?'notes':k==='session'?'sessions':'loot'].push(o);save();paint();genericEdit(k,o.id);return}if('edit'+k in d){genericEdit(k,d['edit'+k]);return}}
if('deletegeneric'in d){let k=d.deletegeneric,array=data[k==='npc'?'npcs':k==='note'?'notes':k==='session'?'sessions':'loot'];if(confirm('Delete this item?')){array.splice(array.findIndex(x=>x.id===d.gid),1);save();$('#modalroot').innerHTML='';paint()}return}
if('clock'in d){let c=data.clocks.find(x=>x.id===d.clock);c.value=c.value===+d.value?+d.value-1:+d.value;save();paint();return}if('resetclock'in d){data.clocks.find(x=>x.id===d.resetclock).value=0;save();paint();return}if('addclock'in d){const title=prompt('Story clock title');if(title){data.clocks.push({id:id(),title,value:0,max:6});save();paint()}return}
if('export'in d){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thistlewick-backup.json';a.click();URL.revokeObjectURL(url);return}if('import'in d){$('#importfile').click();return}if('reset'in d){if(confirm('Reset all campaign data? Export your backup first.')){data=seed();save();paint()}return}
});
document.addEventListener('change',e=>{if(e.target.id==='importfile'){const f=e.target.files?.[0];if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(!Array.isArray(x.characters)||!Array.isArray(x.npcs))throw Error('Invalid');if(confirm('Replace current data with imported backup?')){data=x;save();paint()}}catch{alert('Invalid backup file')}});return}const k=e.target.dataset.key;if(k){let v=e.target.value;if(k.startsWith('campaign.'))data.campaign[k.split('.')[1]]=v;else if(k.startsWith('generic.')){let d=$('#modalroot').dataset;const x=data[d.kind==='npc'?'npcs':d.kind==='note'?'notes':d.kind==='session'?'sessions':'loot'].find(x=>x.id===d.gid);if(x)x[k.split('.')[1]]=v}else if(k!=='newitem'&&k!=='newitemnotes'){data.characters[current][k]=v}save()}if(e.target.dataset.stat){data.characters[current].stats[e.target.dataset.stat]=+e.target.value||0;save()}})}
bind();paint();
</script></body></html>
