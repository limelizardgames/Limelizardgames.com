<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14221e"><title>Thistlewick • Root GM Chronicle</title><style>
:root{--bg:#10201b;--card:#1d322a;--card2:#284336;--line:#45624e;--txt:#f7f0db;--dim:#b7c8b9;--gold:#e3be77;--red:#df9c91;--green:#9ec7a7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3{font-family:Georgia,serif;margin:0 0 10px}h1{font-size:32px}h2{font-size:24px}p{color:var(--dim);margin:5px 0 14px}small,.muted{color:var(--dim)}.layout{display:flex;min-height:100vh}.side{width:242px;background:#142720;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;flex:none;overflow:auto}.logo{font:25px Georgia,serif;padding:12px;color:var(--gold)}.logo small{font:11px system-ui;display:block;letter-spacing:2px;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;text-align:left;border:0;color:var(--dim);padding:12px;border-radius:10px}.nav button.on,.nav button:hover{background:#35523e;color:var(--txt)}main{padding:28px;max-width:1400px;flex:1;min-width:0}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.badge{display:inline-block;border:1px solid #876f46;border-radius:20px;color:var(--gold);padding:3px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--card);min-width:0;margin-bottom:14px}.hero{background:linear-gradient(110deg,#355542,#1a3429);padding:28px;border-radius:18px;margin-bottom:25px;border:1px solid #6a866b}.btn{background:var(--gold);color:#291e0e;font-weight:750;padding:10px 15px;border:0;border-radius:8px;margin:3px}.btn.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.btn.danger{background:#723c34;color:white}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:13px}.field label{font-size:12px;color:var(--dim)}input,textarea,select{width:100%;background:#11251e;color:var(--txt);padding:10px;border-radius:8px;border:1px solid #57715a}textarea{min-height:88px;resize:vertical}.stack{display:grid;gap:5px}.stat{background:#13291e;padding:9px;border-radius:9px;text-align:center}.stat strong{font:26px Georgia,serif;color:var(--gold);display:block}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tiny{font-size:11px}.track{display:flex;gap:6px;flex-wrap:wrap}.box{width:25px;height:26px;border-radius:5px;background:#13251c;border:2px solid #6b816e}.box.fill{background:var(--red);border-color:#efc1ab}.line{border-bottom:1px solid var(--line);padding:12px 0}.line:last-child{border:none}.notice{padding:14px;border-radius:9px;background:#37472d;color:#f6e3b9;margin:12px 0}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:13px 0}.tabs button.on{background:var(--gold);color:#20180c}.modalback{position:fixed;inset:0;background:#050d0bd8;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:10}.modal{background:#193126;border:1px solid #7a946d;border-radius:18px;padding:22px;width:min(900px,100%);margin:auto}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sub{font:19px Georgia,serif;color:var(--gold);margin:18px 0 10px}.hide{display:none}.roll{font:48px Georgia,serif;color:var(--gold)}.status{color:var(--green);font-size:12px}.print-only{display:none}pre{white-space:pre-wrap}.rowbutton{border:1px solid var(--line);background:#263e31;border-radius:8px;color:var(--txt);padding:7px 10px}
@media(max-width:980px){.side{width:180px}.grid{grid-template-columns:repeat(2,1fr)}main{padding:16px}}@media(max-width:700px){.layout{display:block}.side{position:static;width:auto;height:auto;padding:8px}.logo{font-size:19px;padding:4px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px;font-size:13px}.grid,.grid.two,.twocol{grid-template-columns:1fr}h1{font-size:25px}.head{display:block}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.stat{padding:5px}.stat strong{font-size:19px}.card{padding:14px}}
@media print{body{background:#fff;color:#111;font:12px Georgia,serif}.side,.no-print,.btn,.head,#main{display:none!important}.print-only{display:block!important}.print-sheet{page-break-after:always;border:1px solid #444;padding:15px;margin-bottom:10px}h1,h2{color:#111}p,small{color:#333}.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.print-box{border:1px solid #aaa;padding:8px;margin:7px 0;white-space:pre-wrap}}
.guide-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.guide-opt{display:flex;gap:9px;align-items:center;background:#13251e;padding:10px;border:1px solid var(--line);border-radius:8px}.guide-opt input{width:auto;accent-color:#dfbd79}.guide-opt span{font-size:13px}.wizard-status{background:#304d3a;padding:13px;border-radius:10px;margin:12px 0}@media(max-width:700px){.guide-choices{grid-template-columns:1fr}} </style><script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body>
<div class="layout"><aside class="side no-print"><div class="logo">🌳 Thistlewick<small>GM Chronicle</small></div><nav id="nav" class="nav"></nav><p class="tiny" style="padding:10px">🔒 Data stays in this browser. Export backups regularly. This version is not account-based or synchronized across devices.</p></aside><main><div id="main"></div><div id="print" class="print-only"></div></main></div><div id="modalroot"></div><script>
const KEY='thistlewick_portal_v2';

const PLAYBOOK_DATA={
'The Adventurer':{base:[2,1,0,0,-1],natures:['Extrovert','Peacemaker'],drives:['Ambition','Clean Paws','Principles','Justice'],moves:['Sterling Reputation','Subduing Strikes','Talon on the Pulse','Orator','Well-Read','Fast Friends'],fixedMoves:[],moveSlots:3,feats:['Counterfeit','Sleight of Hand'],featSlots:0,weapons:['Disarm','Harry','Improvise','Parry'],value:9,connectionTypes:['Partner','Friend'],intro:'Diplomatic vagabond who builds connections.'},
'The Arbiter':{base:[1,0,0,-1,2],natures:['Defender','Punisher'],drives:['Justice','Principles','Loyalty','Protection'],moves:['Brute','Carry a Big Stick','Crash and Smash','Hardy','Strong Draw','Guardian'],fixedMoves:[],moveSlots:3,feats:[],featSlots:1,weapons:['Cleave','Disarm','Parry','Storm a Group'],value:10,connectionTypes:['Protector','Partner'],intro:'Protective, stubborn fighter with a code.'},
'The Harrier':{base:[0,-1,2,1,0],natures:['Dutiful','Competitive'],drives:['Crime','Discovery','Infamy','Wanderlust'],moves:['Cross Country','Fleet of Foot and Hand','Don’t Shoot the Messenger','Parkour','Traveler Extraordinaire','Smuggler’s Path'],fixedMoves:[],moveSlots:3,feats:['Acrobatics','Sneak'],featSlots:0,weapons:['Disarm','Harry','Quick Shot','Trick Shot'],value:9,connectionTypes:['Professional','Friend'],intro:'Speedy, resourceful traveler.'},
'The Ranger':{base:[-1,1,1,0,1],natures:['Loner','Cynic'],drives:['Discovery','Freedom','Revenge','Protection'],moves:['Silent Paws','Slip Away','Poisons and Antidotes','Forager','Threatening Visage','Dirty Fighter'],fixedMoves:[],moveSlots:3,feats:['Sneak','Hide'],featSlots:0,weapons:['Cleave','Disarm','Harry','Vicious Strike'],value:9,connectionTypes:['Watcher','Protector'],intro:'Sharp-eyed wanderer of the forest.'},
'The Ronin':{base:[0,1,0,-1,2],natures:['Survivor','Pilgrim'],drives:['Principles','Revenge','Thrills','Wanderlust'],moves:['Always Armed','Knowing a Lord’s Will','Well-Mannered','Fealty','The Rules of War','Always Watching'],fixedMoves:[],moveSlots:3,feats:['Blindside'],featSlots:0,weapons:['Cleave','Harry','Storm a Group','Vicious Strike'],value:11,connectionTypes:['Partner','Watcher'],intro:'Masterless swordsman seeking purpose.'},
'The Scoundrel':{base:[1,-1,0,2,0],natures:['Arsonist','Combative'],drives:['Chaos','Thrills','Crime','Infamy'],moves:['Arsonist','Create to Destroy','It’s a Distraction!','Daredevil','Danger Mask','Better Lucky than Good'],fixedMoves:[],moveSlots:3,feats:['Acrobatics','Sneak','Hide'],featSlots:0,weapons:['Confuse Senses','Improvise','Quick Shot','Vicious Strike'],value:8,connectionTypes:['Friend','Partner'],intro:'Reckless chaos-agent and saboteur.'},
'The Thief':{base:[0,0,2,1,-1],natures:['Kleptomaniac','Rebellious'],drives:['Freedom','Greed','Ambition','Thrills'],moves:['Breaking and Entering','Disappear Into the Dark','Rope-a-Dope','Small Hands','Master Thief','Nose for Gold'],fixedMoves:[],moveSlots:3,feats:[],featSlots:4,weapons:[],value:6,connectionTypes:['Professional','Friend'],intro:'Criminal skilled at finding and taking valuables.'},
'The Tinker':{base:[-1,2,1,0,0],natures:['Perfectionist','Radical'],drives:['Greed','Ambition','Revenge','Protection'],moves:['Big Pockets','Jury Rig','Nimble Mind','Dismantle'],fixedMoves:['Toolbox','Repair'],moveSlots:1,feats:['Counterfeit','Disable Device','Pick Lock'],featSlots:0,weapons:['Cleave','Harry','Improvise','Trick Shot'],value:8,connectionTypes:['Professional','Family'],intro:'Inventor, repairer and problem solver.'},
'The Vagrant':{base:[2,1,-1,0,0],natures:['Glutton','Hustler'],drives:['Chaos','Thrills','Clean Paws','Wanderlust'],moves:['Instigator','Pleasant Facade','Desperate Smile','Charm Offensive','Let’s Play','Pocket Sand'],fixedMoves:[],moveSlots:3,feats:['Pick Lock','Sleight of Hand'],featSlots:0,weapons:['Harry','Improvise','Quick Shot','Vicious Strike'],value:9,connectionTypes:['Family','Watcher'],intro:'Smooth-talking opportunist who survives by wit.'}
};
const ALL_FEATS=['Acrobatics','Blindside','Counterfeit','Disable Device','Hide','Pickpocket','Sneak','Pick Lock','Sleight of Hand'];
function buildInit(c){
 if(!c.build||c.build.playbook!==c.playbook){
  const pb=PLAYBOOK_DATA[c.playbook]||PLAYBOOK_DATA['The Adventurer'];
  c.build={playbook:c.playbook,bonus:'',nature:'',drives:[],chosenMoves:[],chosenFeats:[...pb.feats],weapon:'',connections:'',background:'',initialized:false};
 }
 return c.build;
}
function applyPlaybook(c,force=false){
 const pb=PLAYBOOK_DATA[c.playbook],b=buildInit(c);if(!force&&b.initialized)return;
 c.stats=Object.fromEntries(stats.map((k,i)=>[k,pb.base[i]+(b.bonus===k?1:0)]));
 c.nature=b.nature;c.drives=b.drives.join(', ');c.moves=[...pb.fixedMoves,...b.chosenMoves].join(', ');c.feats=b.chosenFeats.join(', ');c.skills=b.weapon;c.value=pb.value;b.initialized=true;
}
function validBuild(c){
 const pb=PLAYBOOK_DATA[c.playbook],b=buildInit(c),issues=[];
 if(!c.name.trim())issues.push('Name');
 if(!c.animal.trim())issues.push('Species');
 if(!b.bonus)issues.push('+1 stat bonus');
 if(!b.nature)issues.push('Nature');
 if(b.drives.length!==2)issues.push('Choose two drives');
 if(b.chosenMoves.length!==pb.moveSlots)issues.push('Choose '+pb.moveSlots+' optional move'+(pb.moveSlots===1?'':'s'));
 if(b.chosenFeats.length!==pb.feats.length+pb.featSlots)issues.push('Starting roguish feats');
 if(!b.weapon)issues.push('Weapon skill');
 if(!c.connections.trim())issues.push('Connections');
 return issues;
}
function wizardChoice(label,key,options,current,help){return '<div class="field"><label>'+label+'</label><select data-build="'+key+'"><option value="">Choose...</option>'+options.map(x=>'<option value="'+esc(x)+'" '+(current===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'+(help?'<small>'+help+'</small>':'')+'</div>'}
function characterWizard(i){
 const c=data.characters[i],b=buildInit(c),pb=PLAYBOOK_DATA[c.playbook];applyPlaybook(c);
 const checkboxGroup=(key,opts,selected,max)=>'<div class="field"><label>'+key+' — choose '+max+'</label><div class="guide-choices">'+opts.map(x=>'<label class="guide-opt"><input type="checkbox" data-checkgroup="'+key+'" value="'+esc(x)+'" '+(selected.includes(x)?'checked':'')+'><span>'+esc(x)+'</span></label>').join('')+'</div></div>';
 const st=stats.map((k,j)=>'<div class="stat"><span class="tiny">'+k+'</span><strong>'+(c.stats[k]>=0?'+':'')+c.stats[k]+'</strong><span class="tiny">'+(pb.base[j]>=0?'+':'')+pb.base[j]+' base</span></div>').join('');
 const problems=validBuild(c);
 const special=pb.weapons.length===0?'The Thief: verify bold eligible weapon skills in your official playbook PDF before choosing.':null;
 editor('Character Creation • '+esc(c.name||'New Vagabond'),'<div class="wizard-status">'+(problems.length?'<b>'+problems.length+' remaining steps</b><p>'+esc(problems.join(' • '))+'</p>':'<b>✓ All guided choices recorded!</b><p>Review the printed playbook and background answers before play.</p>')+'</div><div class="twocol">'+field('Character name','name',c.name)+field('Player name','player',c.player)+field('Animal species','animal',c.animal)+wizardChoice('Playbook','playbook',books,c.playbook)+'</div><p>'+esc(pb.intro)+'</p><div class="card"><h3>1. Starting stats</h3><p>Stats are predefined by your playbook. Select one stat to receive +1 (maximum +2). No random stat rolls.</p>'+wizardChoice('Add +1 to','bonus',stats.filter((k,j)=>pb.base[j]<2),b.bonus)+'<div class="stats">'+st+'</div></div><div class="card"><h3>2. Nature and drives</h3>'+wizardChoice('Choose one Nature','nature',pb.natures,b.nature)+checkboxGroup('drives',pb.drives,b.drives,2)+'</div><div class="card"><h3>3. Playbook moves</h3>'+(pb.fixedMoves.length?'<p><b>Always start with:</b> '+esc(pb.fixedMoves.join(', '))+'</p>':'')+checkboxGroup('chosenMoves',pb.moves,b.chosenMoves,pb.moveSlots)+'</div><div class="card"><h3>4. Roguish feats and weapon skill</h3>'+(pb.featSlots?checkboxGroup('chosenFeats',ALL_FEATS,b.chosenFeats,pb.featSlots):'<p><b>Starting feats:</b> '+esc(pb.feats.join(', '))+'</p>')+wizardChoice('Starting weapon skill','weapon',pb.weapons.length?pb.weapons:['Cleave','Confuse Senses','Disarm','Harry','Improvise','Parry','Quick Shot','Storm a Group','Trick Shot','Vicious Strike'],b.weapon,special)+'</div><div class="card"><h3>5. Background and connections</h3><p><b>Connection types:</b> '+esc(pb.connectionTypes.join(' or '))+'. Complete a connection with another player.</p>'+field('Connections','connections',c.connections,'textarea')+field('Background and origin','background',b.background,'textarea')+'</div><div class="card"><h3>6. Review and print</h3><p>Starting equipment value: <b>'+pb.value+'</b>. Choose actual gear following the official playbook. Carrying capacity uses Might. Also answer the printed background questions and mark starting faction reputation.</p><button class="btn alt" data-editpc="'+i+'">Open full character record</button><button class="btn alt" data-printpc="'+i+'">Print summary</button></div>', '<button class="btn" data-wizard-done="'+i+'">Save & finish</button>');
}

const pdfLink=c=>'https://root-rpg.vercel.app/playbooks/Root-Playbook-'+encodeURIComponent(c.playbook.replace(/^The /,''))+'.pdf';
const magpie='https://magpiegames.com/products/play-materials-corebookroot';
const moveList=[['Persuade an NPC','Charm'],['Figure Someone Out','Charm'],['Trick an NPC','Cunning'],['Read a Tense Situation','Cunning'],['Attempt a trained roguish feat','Finesse'],['Target a vulnerable foe','Finesse'],['Trust Fate','Luck'],['Quick Shot (skill)','Luck'],['Wreck Something','Might'],['Engage in Melee','Might'],['Grapple','Might'],['Help or Interfere','Special'],['Ask a Favor / Meet Important NPC','Reputation']];
function rollGuide(){return '<div class="card"><h2>What do I roll for each stat?</h2><p>Character stats are chosen from the official playbook, not rolled randomly. During play, roll <b>2d6 + the stat specified by the triggered move.</b></p>'+moveList.map(m=>'<div class="line flex space"><span>'+m[0]+'</span><b>'+m[1]+'</b></div>').join('')+'<p>10+ strong hit; 7–9 weak hit; 6 or less miss. Playbook moves can modify which stat applies. Faction reputation is a separate modifier.</p></div>'}
function playbookPanel(i){const c=data.characters[i];return '<div class="card"><h3>Official '+esc(c.playbook)+' Playbook</h3><p>Download the actual playbook PDF, or download a single printable packet combining it with your filled-in character record.</p><a href="'+pdfLink(c)+'" target="_blank" rel="noopener" class="btn" style="display:inline-block;text-decoration:none">Download playbook</a><a href="'+magpie+'" target="_blank" rel="noopener" class="btn alt" style="display:inline-block;text-decoration:none">Official publisher printables</a><button class="btn" data-packet="'+i+'">Download combined PDF</button><input type="file" id="packetfile'+i+'" data-packetfile="'+i+'" accept=".pdf,application/pdf" style="display:none"><p class="tiny">For the combined download, first save the playbook PDF above; then choose it when prompted. The full official playbook remains unchanged in your combined PDF.</p></div>'}
function rules(){return header('Root Rolls & Playbooks','The quick reference for the five stats and corresponding moves.')+rollGuide()}

const stats=['Charm','Cunning','Finesse','Luck','Might'], books=['The Adventurer','The Arbiter','The Harrier','The Ranger','The Ronin','The Scoundrel','The Thief','The Tinker','The Vagrant'];
const seed=()=>({campaign:{name:'The Unfortunate Adventures of the Critter Committee',season:'A Nut Above the Law',session:1},characters:Array.from({length:3},(_,i)=>({id:'pc'+i,name:'',player:'',animal:'',playbook:books[i],pronouns:'',nature:'',drives:'',connections:'',moves:'',skills:'',feats:'',look:'',notes:'',secret:'',stats:Object.fromEntries(stats.map(s=>[s,0])),injury:0,exhaustion:0,depletion:0,inventory:[],reputation:'',value:0,advancement:0})),npcs:[{id:'n1',name:'Mayor Bartholomew Bramblebottom',animal:'Mouse',role:'Mayor',faction:'Village',status:'Active',voice:'Pompous and nervous',secret:'Covered up the Golden Acorn fraud for twenty years.',notes:'Offers 50 coins for the relic.'},{id:'n2',name:'Sir Quackson the Unyielding',animal:'Duck',role:'Self-appointed sovereign',faction:'Duckistan',status:'Active',voice:'Bombastic would-be king',secret:'His kingdom is only a bridge and two ducks.',notes:'Demand tolls of sandwiches, compliments, or duels.'},{id:'n3',name:'Nibbles McCrackin',animal:'Squirrel',role:'Panicked informant',faction:'Independent',status:'Active',voice:'Screaming, talks too fast',secret:'Wrongly believes ducks stole the relic.',notes:'Has yellow paint on his claws.'},{id:'n4',name:'Captain Cornelius Clawford',animal:'Cat',role:'Marquisate commander',faction:'Marquise de Cat',status:'Active',voice:'Angry paperwork obsessive',secret:'Wants the tax ledger to exploit the mayor.',notes:'Arrives at Hollow Oak with three soldiers.'},{id:'n5',name:'Morris Diggleby',animal:'Mole',role:'Mayoral assistant',faction:'Independent',status:'Active',voice:'Softly apologetic',secret:'Stole the painted walnut and ledger.',notes:'Wants to expose the mayor.'},{id:'n6',name:'Mabel Sogbottom',animal:'Stoat',role:'Tavernkeeper',faction:'Village',status:'Active',voice:'Gravelly and unimpressed',secret:'Knows the original relic vanished years ago.',notes:'Owns the Soggy Stoat Tavern.'}],notes:[{id:'note1',title:'The truth about the acorn',category:'Secret',body:'The Golden Acorn is a painted walnut. The real acorn vanished twenty years ago. Its significance is political, not magical.'}],sessions:[{id:'s1',title:'A Nut Above the Law',date:'',status:'Planned',recap:'Tavern -> Duck bridge -> Hollow Oak -> Marquisate confrontation. Let players choose who receives the ledger.'}],clocks:[{id:'c1',title:'Marquisate suspicion',value:0,max:6},{id:'c2',title:'Village unrest',value:0,max:6},{id:'c3',title:'Duckistan hostility',value:0,max:4}],loot:[],history:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}let page='dashboard',modal='',current=0;
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&quot;'}[c])),id=()=>Math.random().toString(36).slice(2,10);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('#saved')?.replaceChildren(document.createTextNode('Saved locally ✓'))}catch{alert('Storage full/unavailable. Export a backup!')}}function field(label,key,v,kind='text'){const iid='i_'+key;return '<div class="field"><label for="'+iid+'">'+esc(label)+'</label>'+(kind==='textarea'?'<textarea id="'+iid+'" data-key="'+key+'">'+esc(v)+'</textarea>':kind==='select'?'<select id="'+iid+'" data-key="'+key+'">'+books.map(b=>'<option '+(b===v?'selected':'')+'>'+esc(b)+'</option>').join('')+'</select>':'<input id="'+iid+'" data-key="'+key+'" type="'+kind+'" value="'+esc(v)+'">')+'</div>'}
const nav=[['dashboard','🏠 Overview'],['characters','🐾 Characters'],['dice','🎲 Dice Roller'],['rules','📖 Roll Guide'],['npcs','🦊 NPC Directory'],['sessions','📜 Sessions'],['clocks','🚩 Factions & Clocks'],['notes','📓 GM Notes'],['loot','🎒 Shared Loot'],['settings','⚙️ Settings']];
function header(t,sub,act=''){return '<div class="head"><div><div class="badge">ROOT • CAMPAIGN MANAGER</div><h1>'+t+'</h1><p>'+sub+'</p></div><div>'+act+'</div></div>'}
function setPage(p){page=p;paint()}
function paint(){ $('#nav').innerHTML=nav.map(([k,l])=>'<button class="'+(page===k?'on':'')+'" data-nav="'+k+'">'+l+'</button>').join('');$('#main').innerHTML=({dashboard,characters,dice,rules,npcs,sessions,clocks,notes,loot,settings}[page]||dashboard)(); }
function dashboard(){return header('Welcome to Thistlewick','The Unfortunate Adventures of the Critter Committee')+'<section class="hero"><span class="badge">SEASON ONE</span><h1>A Nut Above the Law</h1><p>Three vagabonds. One painted walnut. One corrupt mayor. An unreasonably angry duck.</p><button class="btn" data-nav="characters">Create Characters</button><button class="btn alt" data-nav="sessions">Run Session One</button></section><div class="grid"><div class="card"><h2>'+data.characters.length+'</h2><p>Player character slots</p></div><div class="card"><h2>'+data.npcs.length+'</h2><p>Tracked NPCs</p></div><div class="card"><h2>'+data.sessions.length+'</h2><p>Adventure sessions</p></div></div><div class="grid two"><div class="card"><h2>Party</h2>'+data.characters.map((c,i)=>'<div class="line flex space"><div><b>'+esc(c.name||'Unnamed Vagabond '+(i+1))+'</b><div class="tiny muted">'+esc(c.animal)+' · '+esc(c.playbook)+'</div></div><button class="btn alt" data-editpc="'+i+'">Edit</button></div>').join('')+'</div><div class="card"><h2>Adventure prompts</h2><p>Opening: Mayor Bramblebottom declares that someone stole his most precious nut. Nibbles bursts in shouting “THE DUCKS KNOW EVERYTHING!”</p><p>Clues: yellow paint, a torn button, Morris’s cart, bridge toll, Hollow Oak.</p><p>Final choice: expose the mayor, sell the ledger, or flee with everything.</p></div></div>'}

ton" data-wear="'+j+'" data-delta="-1">−</button><button class="rowbutton" data-wear="'+j+'" data-delta="1">+</button><button class="rowbutton" data-removeitem="'+j+'">Delete</button></div></div>').join('')+'</div><div class="twocol">'+g('New item','newitem','')+g('Item notes','newitemnotes','')+'</div><button class="btn alt" data-additem>+ Add item</button>','<button class="btn" data-close>Done</button>')}
function genericEdit(kind,i){let obj,title,props;if(kind==='npc'){obj=data.npcs.find(x=>x.id===i);title='NPC';props=['name','animal','role','faction','status','voice','secret','notes']}if(kind==='note'){obj=data.notes.find(x=>x.id===i);title='Note';props=['title','category','body']}if(kind==='session'){obj=data.sessions.find(x=>x.id===i);title='Session';props=['title','date','status','recap']}if(kind==='loot'){obj=data.loot.find(x=>x.id===i);title='Party Item';props=['name','qty','owner','notes']}editor('Edit '+title,'<div class="twocol">'+props.map(k=>field(k,'generic.'+k,obj[k],['secret','notes','recap','body'].includes(k)?'textarea':'text')).join('')+'</div>','<button class="btn danger" data-deletegeneric="'+kind+'" data-gid="'+i+'">Delete '+title+'</button>');$('#modalroot').dataset.kind=kind;$('#modalroot').dataset.gid=i}

async function makePacket(i,file){
if(!file)return;
if(!window.PDFLib){alert('PDF builder did not load. Reload the page while online and try again.');return}
try{
 const c=data.characters[i],lib=window.PDFLib,doc=await lib.PDFDocument.create(),font=await doc.embedFont(lib.StandardFonts.Helvetica),bold=await doc.embedFont(lib.StandardFonts.HelveticaBold);
 let pg=doc.addPage([612,792]),y=752;
 const line=(str,size=10,heavy=false)=>{if(y<50){pg=doc.addPage([612,792]);y=752}pg.drawText(String(str??'').replace(/[^\x20-\x7e]/g,' '),{x:40,y,size,font:heavy?bold:font});y-=size+8};
 const section=(label,val)=>{line(label,12,true);let words=String(val||'None').replace(/\s+/g,' ').split(' '),part='';for(const word of words){if((part+' '+word).length>90){line(part);part=word}else part+=(part?' ':'')+word}if(part)line(part);y-=7};

 section('Character / Player',c.name+' / '+c.player+' / '+c.animal+' / '+c.playbook);
 section('Stats',stats.map(s=>s+': '+(c.stats[s]>=0?'+':'')+c.stats[s]).join('    '));
 section('Tracks','Injury '+c.injury+'/4; Exhaustion '+c.exhaustion+'/4; Depletion '+c.depletion+'/4');
 section('Nature',c.nature);section('Drives',c.drives);section('Connections',c.connections);section('Moves',c.moves);section('Roguish Feats',c.feats);section('Weapon Skills',c.skills);section('Faction Reputation',c.reputation);
 section('Inventory',c.inventory.map(x=>x.name+' / wear '+(x.wear||0)+' / '+x.notes).join('; '));
 section('Notes',c.notes);
 const official=await lib.PDFDocument.load(await file.arrayBuffer()),pages=await doc.copyPages(official,official.getPageIndices());pages.forEach(page=>doc.addPage(page));
 const bytes=await doc.save(),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');

}catch(e){alert('Could not combine PDFs. Please select the matching, unencrypted playbook PDF. '+e.message)}
}
function printChars(chars){$('#print').innerHTML=chars.map(printable).join('');window.print()}
function bind(){document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){setPage(d.nav);return}if('close'in d){$('#modalroot').innerHTML='';paint();return}if('editpc'in d){editpc(+d.editpc);return}if('wizard'in d){characterWizard(+d.wizard);return}if('wizardDone'in d){save();$('#modalroot').innerHTML='';paint();return}if('addpc'in d){data.characters.push(seed().characters[0]);data.characters.at(-1).id=id();save();paint();editpc(data.characters.length-1);return}if('deletepc'in d){if(confirm('Delete this character?')){data.characters.splice(+d.deletepc,1);save();$('#modalroot').innerHTML='';paint()}return}if('track'in d){let c=data.characters.find(x=>x.id===d.cid)||data.characters.find(x=>x===data.characters[0]);const card=b.closest('.card');const ci=[...card.parentElement.children].indexOf(card);c=data.characters[ci];c[d.track]=c[d.track]===+d.trackn?+d.trackn-1:+d.trackn;save();paint();return}if('pctrack'in d){const c=data.characters[current];c[d.pctrack]=Math.min(4,Math.max(0,c[d.pctrack]+ +d.delta));save();editpc(current);return}if('wear'in d){let item=data.characters[current].inventory[+d.wear];item.wear=Math.max(0,(+item.wear||0)+ +d.delta);save();editpc(current);return}if('removeitem'in d){data.characters[current].inventory.splice(+d.removeitem,1);save();editpc(current);return}if('additem'in d){const n=$('[data-key="newitem"]')?.value.trim();if(n){data.characters[current].inventory.push({name:n,notes:$('[data-key="newitemnotes"]').value,wear:0});save();editpc(current)}return}if('printpc'in d){printChars([data.characters[+d.printpc]]);return}if('printall'in d){printChars(data.characters);return}if('packet'in d){$('#packetfile'+d.packet)?.click();return}
if('roll'in d||'d6'in d){let a=1+Math.floor(Math.random()*6),bb=1+Math.floor(Math.random()*6),pc=+$('#rollpc').value,st=$('#rollstat').value,mod=st==='manual'?(+$('#rollmod').value||0):pc>=0?(data.characters[pc].stats[st]||0):0,total=a+('roll'in d?bb:0)+('roll'in d?mod:0),res='roll'in d?(total>=10?'Strong hit':total>=7?'Weak hit':'Miss'):'d6 result';let msg='roll'in d?a+' + '+bb+' '+(mod>=0?'+ ':'− ')+Math.abs(mod)+' = '+total+' · '+res:String(a);$('#rollresult').textContent=msg;data.history.unshift({id:id(),result:msg,reason:$('#rollreason').value||st,when:new Date().toLocaleString()});data.history=data.history.slice(0,100);save();$('#history').innerHTML=data.history.slice(0,20).map(x=>'<div class="line"><b>'+esc(x.result)+'</b> — '+esc(x.reason)+'</div>').join('');return}
for(const k of ['npc','note','session','loot']){if('add'+k in d){const defaults={npc:{name:'New NPC',animal:'',role:'',faction:'Independent',status:'Active',voice:'',secret:'',notes:''},note:{title:'New Note',category:'General',body:''},session:{title:'Untitled Session',date:'',status:'Planned',recap:''},loot:{name:'New Item',qty:1,owner:'Party',notes:''}};let o={...defaults[k],id:id()};data[k==='npc'?'npcs':k==='note'?'notes':k==='session'?'sessions':'loot'].push(o);save();paint();genericEdit(k,o.id);return}if('edit'+k in d){genericEdit(k,d['edit'+k]);return}}
if('deletegeneric'in d){let k=d.deletegeneric,array=data[k==='npc'?'npcs':k==='note'?'notes':k==='session'?'sessions':'loot'];if(confirm('Delete this item?')){array.splice(array.findIndex(x=>x.id===d.gid),1);save();$('#modalroot').innerHTML='';paint()}return}
if('clock'in d){let c=data.clocks.find(x=>x.id===d.clock);c.value=c.value===+d.value?+d.value-1:+d.value;save();paint();return}if('resetclock'in d){data.clocks.find(x=>x.id===d.resetclock).value=0;save();paint();return}if('addclock'in d){const title=prompt('Story clock title');if(title){data.clocks.push({id:id(),title,value:0,max:6});save();paint()}return}
if('export'in d){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thistlewick-backup.json';a.click();URL.revokeObjectURL(url);return}if('import'in d){$('#importfile').click();return}if('reset'in d){if(confirm('Reset all campaign data? Export your backup first.')){data=seed();save();paint()}return}
});
document.addEventListener('change',e=>{if(e.target.dataset.build!==undefined){const c=data.characters[current],v=e.target.value,k=e.target.dataset.build;if(k==='playbook'){if(c.playbook!==v){if(!confirm('Changing the playbook will replace guided stat and move choices. Continue?')){characterWizard(current);return}c.playbook=v;c.build=null;buildInit(c);applyPlaybook(c,true)}}else{const b=buildInit(c);b[k]=v;if(k==='bonus'||k==='nature')applyPlaybook(c,true);if(k==='background')c.notes=(c.notes||'')+'\n'+v}save();characterWizard(current);return}if(e.target.dataset.checkgroup!==undefined){const c=data.characters[current],b=buildInit(c),k=e.target.dataset.checkgroup,pb=PLAYBOOK_DATA[c.playbook],max=k==='drives'?2:k==='chosenMoves'?pb.moveSlots:pb.featSlots,selected=[...document.querySelectorAll('[data-checkgroup="'+k+'"]:checked')].map(x=>x.value);if(selected.length>max){e.target.checked=false;return}b[k]=selected;applyPlaybook(c,true);save();characterWizard(current);return}if(e.target.dataset.packetfile!==undefined){makePacket(+e.target.dataset.packetfile,e.target.files?.[0]);e.target.value='';return}if(e.target.id==='rollmove'){const m=moveList.find(x=>x[0]===e.target.value);if(m){$('#rollstat').value=stats.includes(m[1])?m[1]:'manual';$('#rollreason').value=m[0]}return}if(e.target.id==='importfile'){const f=e.target.files?.[0];if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(!Array.isArray(x.characters)||!Array.isArray(x.npcs))throw Error('Invalid');if(confirm('Replace current data with imported backup?')){data=x;save();paint()}}catch{alert('Invalid backup file')}});return}const k=e.target.dataset.key;if(k){let v=e.target.value;if(k.startsWith('campaign.'))data.campaign[k.split('.')[1]]=v;else if(k.startsWith('generic.')){let d=$('#modalroot').dataset;const x=data[d.kind==='npc'?'npcs':d.kind==='note'?'notes':d.kind==='session'?'sessions':'loot'].find(x=>x.id===d.gid);if(x)x[k.split('.')[1]]=v}else if(k!=='newitem'&&k!=='newitemnotes'){data.characters[curre
